<!DOCTYPE html>
<html lang="en-US">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width">
		<title>eXpansion Result Page</title>
		<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css"/>
		<style>
			@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap');

			/* --- ANIMATIONS --- */
			@keyframes fadeInUp {
			  from {
				opacity: 0;
				transform: translateY(20px);
			  }
			  to {
				opacity: 1;
				transform: translateY(0);
			  }
			}

			@keyframes fadeIn {
			  from { opacity: 0; }
			  to { opacity: 1; }
			}

			/* --- GLOBAL --- */
			body {
			  font-family: "KenneyIcons", 'FontAwesome', "Montserrat", sans-serif;
			  background-color: #0f0f0f;
			  color: #e4e4e4;
			  margin: 0;
			  padding: 0;
			  line-height: 1.6;
			  text-align: center;
			}

			/* --- HEADER --- */
			header {
			  margin: 40px 0 10px;
			  animation: fadeIn 1s ease-in-out;
			}

			header img.logo {
			  max-width: 220px;
			  height: auto;
			  animation: fadeInUp 1s ease-in-out;
			}

			/* --- TITRES --- */
			h1 {
			  font-weight: 700;
			  font-size: 2.4rem;
			  color: #ffffff;
			  margin: 10px 0 25px;
			  letter-spacing: 1px;
			  text-transform: uppercase;
			  text-align: center;
			  text-shadow: 0 0 10px rgba(255,255,255,0.1);
			  animation: fadeInUp 1s ease-in-out 0.2s both;
			}

			h3 {
			  font-weight: 600;
			  font-size: 1.1rem;
			  color: #cccccc;
			  margin-top: 30px;
			  letter-spacing: 0.5px;
			  text-align: center;
			  animation: fadeInUp 1s ease-in-out 0.4s both;
			}

			a {
			  color: #7289da;
			  font-weight: 600;
			  text-decoration: none;
			}

			a:hover {
			  color: #fff;
			}

			/* --- TABLEAU ZÉBRÉ --- */
			table {
			  width: 95%;
			  margin: 40px auto 60px;
			  border-collapse: collapse;
			  background-color: #1a1a1a;
			  border: 1px solid #2a2a2a;
			  border-radius: 12px;
			  overflow: hidden;
			  box-shadow: 0 4px 15px rgba(0,0,0,0.6);
			  font-size: 0.95rem;
			  opacity: 0;
			  animation: fadeInUp 1.2s ease-in-out 0.5s forwards;
			}

			th, td {
			  padding: 14px 18px;
			  text-align: center;
			  border-bottom: 1px solid #2a2a2a;
			}

			th {
			  background-color: #252525;
			  color: #ffffff;
			  font-weight: 600;
			  text-transform: uppercase;
			  letter-spacing: 0.5px;
			  position: sticky;
			  top: 0;
			  z-index: 2;
			}

			tr:nth-child(even) {
			  background-color: #1e1e1e;
			}

			tr:nth-child(odd) {
			  background-color: #272727;
			}

			tr:hover td {
			  background-color: #333;
			  transition: background-color 0.2s ease;
			}

			td {
			  color: #dcdcdc;
			}

			/* --- CAPTION --- */
			caption {
			  caption-side: top;
			  padding: 12px;
			  color: #999;
			  font-weight: 500;
			}

			/* --- STYLES POUR LES NICKNAMES --- */
			.tmnick_global {
				font-weight: none;
				font-style: normal;
				letter-spacing: 1px;
				font-size: 11pt
			}
			.tmnick_normal {
				letter-spacing: 1px;
			}
			.tmnick_short {
				letter-spacing: -1px;
			}
			.tmnick_wide {
				letter-spacing: 2px;
			}
			.tmnick_raz {
				font-weight: none;
				font-style: normal;
				letter-spacing: 1px;
			}
			.tmnick_italic {
				font-style: italic;
			}
			.tmnick_bold {
				font-weight: bold;
				letter-spacing: 1px;
			}
			.tmnick_upper {
				text-transform: uppercase;
			}
			.tmnick_shadowed {
				text-shadow: 0.5px 0.5px 0.5px #444;
			}
			.tmnick_internallink,
			.tmnick_internallink:visited {
				color: inherit;
				text-decoration: none;
				border-bottom: 1px solid #000;
			}
			.tmnick_internallink:hover {
				color: inherit;
				text-decoration: none;
				border-bottom: 1px solid Blue;
			}
			.tmnick_internallink_withlogin,
			.tmnick_internallink_withlogin:visited  {
				color: inherit;
				text-decoration: none;
				border-bottom: 1px solid #f0e68c;
			}
			.tmnick_internallink_withlogin:hover {
				color: inherit;
				text-decoration: none;
				border-bottom: 1px solid Gold;
			}
			.tmnick_externallink {
				line-height: 18px;
				color: inherit;
				text-decoration: none;
				border-bottom: 1px solid  #75481e;
			}
			.tmnick_externallink:hover {
				color: inherit;
				border-color: Orange;
			}
		</style>
	</head>
	<body>
		<h1>eXpansion Result Page</h1>
		<br>
		<br>
		%content%
	</body>
</html>
